[voice]
id = "klala"
name = "克拉拉"
description = "崩坏：星穹铁道 - 克拉拉"

[model]
gpt_weights = "GPT_weights_v2ProPlus/克拉拉-e10.ckpt"
sovits_weights = "SoVITS_weights_v2ProPlus/克拉拉_e10_s230.pth"
version = "v2ProPlus"

[ref_audio]
path = "v2ProPlus/克拉拉/reference_audios/中文/emotions/【吃惊】还可以飞上天…飞到宇宙里哦！真的好厉害！.wav"
prompt_text = "【吃惊】还可以飞上天…飞到宇宙里哦！真的好厉害！"
prompt_lang = "all_zh"
aux_ref_audio_paths = []

[params]
text_lang = "all_zh"
text_split_method = "cut5"
top_k = 15
top_p = 1.0
temperature = 1.0
repetition_penalty = 1.35
seed = -1
batch_size = 1
batch_threshold = 0.75
split_bucket = false
parallel_infer = false
speed_factor = 1.0
fragment_interval = 0.3
sample_steps = 32
super_sampling = false
streaming_mode = false
return_fragment = false
overlap_length = 2
min_chunk_length = 16
fixed_length_chunk = false

[output]
media_type = "wav"
