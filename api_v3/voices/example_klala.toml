[voice]
id = "klala"
name = "克拉拉"
description = "崩坏：星穹铁道 - 克拉拉"

[model]
gpt_weights = "GPT_weights_v2/klala-e15.ckpt"
sovits_weights = "SoVITS_weights_v2/klala_e8_s248.pth"
version = "v2ProPlus"

[ref_audio]
path = "voices/klala/ref.wav"
prompt_text = "测试"
prompt_lang = "all_zh"
aux_ref_audio_paths = []

[params]
text_lang = "all_zh"
text_split_method = "cut5"
top_k = 15
top_p = 1.0
temperature = 1.0
repetition_penalty = 1.35
seed = -1
batch_size = 1
batch_threshold = 0.75
split_bucket = true
parallel_infer = true
speed_factor = 1.0
fragment_interval = 0.3
sample_steps = 32
super_sampling = false
streaming_mode = false
return_fragment = false
overlap_length = 2
min_chunk_length = 16
fixed_length_chunk = false

[output]
media_type = "wav"
