[voice]
id = "klala-onnx"
name = "克拉拉-genie"
description = ""

[model]
gpt_weights = ""
sovits_weights = ""
version = "v2ProPlus"
onnx_model_dir = "onnx_models/克拉拉"
backend = "genie"

[ref_audio]
path = "v2ProPlus/克拉拉/reference_audios/中文/emotions/【中立】同样的特质，克拉拉只在史瓦罗先生身上见到过…….wav"
prompt_text = "同样的特质，克拉拉只在史瓦罗先生身上见到过"
prompt_lang = "all_zh"
aux_ref_audio_paths = []

[params]
text_lang = "all_zh"
text_split_method = "cut5"
top_k = 15
top_p = 1.0
temperature = 1.0
repetition_penalty = 1.35
seed = -1
batch_size = 1
batch_threshold = 0.75
split_bucket = true
parallel_infer = true
speed_factor = 1.0
fragment_interval = 0.3
sample_steps = 32
super_sampling = false
streaming_mode = false
return_fragment = false
overlap_length = 2
min_chunk_length = 16
fixed_length_chunk = false

[output]
media_type = "wav"
