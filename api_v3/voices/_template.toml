# GPT-SoVITS API v3 声音配置模板
# 复制此文件并重命名为 {voice_id}.toml，然后填写配置

[voice]
id = ""                # 声音唯一标识（英文，用于 API 调用）
name = ""              # 显示名称
description = ""       # 描述

[model]
gpt_weights = ""       # GPT 模型权重路径
sovits_weights = ""    # SoVITS 模型权重路径
version = "v2"         # 模型版本: v1, v2, v3, v4, v2Pro, v2ProPlus

[ref_audio]
path = ""              # 参考音频路径
prompt_text = ""       # 参考音频对应的文本
prompt_lang = "all_zh" # 参考文本语言
# aux_ref_audio_paths = []  # 辅助参考音频（可选）

[params]
text_lang = "all_zh"
text_split_method = "cut5"
top_k = 15
top_p = 1.0
temperature = 1.0
repetition_penalty = 1.35
seed = -1
batch_size = 1
batch_threshold = 0.75
split_bucket = true
parallel_infer = true
speed_factor = 1.0
fragment_interval = 0.3
sample_steps = 32
super_sampling = false
streaming_mode = false
return_fragment = false

[output]
media_type = "wav"
